<!DOCTYPE html>
<html>
<head>
    <title>AI Calibration Dataset Builder</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- JSZip Library for bundling files (Requires WiFi on first load to cache!) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body { font-family: Arial; text-align: center; margin-top: 10px; background: #222; color: white;}
        h2 { margin: 5px 0; color: #00d2ff; }
        .sec-title { font-size: 14px; color: #aaa; margin: 10px 0 5px; font-weight: bold;}
        .row { display: flex; justify-content: center; gap: 8px; margin: 5px 2%; flex-wrap: wrap;}
        button { padding: 12px 5px; font-size: 16px; border-radius: 8px; font-weight: bold; border:none; cursor: pointer; transition: 0.2s;}
        .mic-btn { width: 90%; background: #007BFF; color: white; padding: 15px; font-size: 18px; margin-bottom: 10px; }
        .lbl-btn { flex: 1 1 20%; background: #444; color: white; border: 2px solid #222; }
        .lbl-btn.active { background: #9b59b6; border-color: #fff; }
        .rec-btn { flex: 1; background: #28A745; color: white; }
        .rec-btn:disabled { background: #555; color: #888; }
        .rec-btn.recording { background: #e74c3c; }
        #cart-panel { background: #333; margin: 15px 5%; padding: 15px; border-radius: 8px; border: 1px solid #555; }
        .export-btn { background: #e67e22; color: white; width: 100%; padding: 15px; font-size: 18px; margin-bottom: 10px;}
        .clear-btn { background: #8b0000; color: white; width: 100%; padding: 10px; font-size: 14px; }
        #log { margin-top: 10px; color: #0f0; text-align: left; padding: 8px; font-size: 12px; background: #111; height: 150px; overflow-y: scroll; border: 1px solid #444;}
    </style>
</head>
<body>

    <h2>Dataset Builder</h2>
    <div style="font-size: 12px; color: #888; margin-bottom: 10px;">16kHz Mono PCM Audio</div>

    <!-- 1. Explicit Mic Enable -->
    <button id="micBtn" class="mic-btn" onclick="enableMic()">1. Enable Mic</button>

    <!-- 2. Label Selection -->
    <div class="sec-title">2. Select Label</div>
    <div class="row">
        <button id="lbl-pull" class="lbl-btn active" onclick="setLabel('pull')">PULL</button>
        <button id="lbl-noise" class="lbl-btn" onclick="setLabel('noise')">NOISE</button>
        <button id="lbl-speech" class="lbl-btn" onclick="setLabel('speech')">SPEECH</button>
        <button id="lbl-unknown" class="lbl-btn" onclick="setLabel('unknown')">UNKNOWN</button>
    </div>

    <!-- 3. Recording Controls -->
    <div class="sec-title">3. Record Audio</div>
    <div class="row">
        <button id="rec-1s" class="rec-btn" onclick="startRec(1)" disabled>1 Sec</button>
        <button id="rec-3s" class="rec-btn" onclick="startRec(3)" disabled>3 Sec</button>
        <button id="rec-cont" class="rec-btn" onclick="startRec(0)" disabled>Continuous</button>
    </div>

    <!-- 4. Shopping Cart / ZIP Export -->
    <div id="cart-panel">
        <div style="font-size:18px; font-weight:bold; margin-bottom:5px;">Files in Cart: <span id="cart-count" style="color:#0f0;">0</span></div>
        <div style="font-size:14px; color:#aaa; margin-bottom:10px;">RAM Usage: <span id="cart-ram">0.00</span> MB</div>
        <button id="exportBtn" class="export-btn" onclick="exportZip()" disabled>Export ZIP to Files</button>
        <button id="clearBtn" class="clear-btn" onclick="clearCart()" disabled>Clear Cart</button>
    </div>

    <div id="log">--- Debug Log ---<br></div>

<script>
    const $ = id => document.getElementById(id);
    function logMsg(msg) { $('log').innerHTML = msg + "<br>" + $('log').innerHTML; }

    let audioCtx, micStream, processor;
    let isMicReady = false, isRecording = false, recTimer = null, audioDataBuffer =[];
    let currentLabel = 'pull';
    let globalId = parseInt(localStorage.getItem('ei_seq_id')) || 1;
    let cart =[], totalBytes = 0;

    async function enableMic() {
        try {
            logMsg("Requesting Mic Permission...");
            micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            window.AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new window.AudioContext({ sampleRate: 16000 });
            if (audioCtx.state === 'suspended') await audioCtx.resume();
            
            isMicReady = true;
            $('micBtn').innerText = "✅ Mic Ready";
            $('micBtn').style.background = "#28A745";
            $('micBtn').disabled = true;
            
            $('rec-1s').disabled = false; $('rec-3s').disabled = false; $('rec-cont').disabled = false;
            logMsg("✅ Mic ready at 16kHz.");
        } catch (e) { logMsg("❌ Mic Error: " + e.message); }
    }

    function setLabel(label) {
        if (isRecording) return;
        currentLabel = label;
        document.querySelectorAll('.lbl-btn').forEach(b => b.classList.remove('active'));
        $('lbl-' + label).classList.add('active');
        logMsg(`🏷️ Label set to: ${label}`);
    }

    function startRec(seconds) {
        if (!isMicReady) return;
        if (isRecording && seconds === 0) { stopRec(); return; }
        if (isRecording) return;

        isRecording = true; audioDataBuffer =[];
        document.querySelectorAll('.rec-btn, .lbl-btn').forEach(b => b.disabled = true);
        
        let activeBtn = seconds === 1 ? $('rec-1s') : (seconds === 3 ? $('rec-3s') : $('rec-cont'));
        activeBtn.disabled = false; activeBtn.classList.add('recording');
        
        if (seconds === 0) {
            activeBtn.innerText = "🛑 Stop (Max 60s)";
            recTimer = setTimeout(() => { stopRec(); }, 60000);
            logMsg(`⏺️ Recording ${currentLabel} continuously...`);
        } else {
            activeBtn.innerText = "🔴 Rec...";
            logMsg(`⏺️ Recording ${currentLabel} for ${seconds}s...`);
            recTimer = setTimeout(() => { stopRec(); }, seconds * 1000);
        }

        const source = audioCtx.createMediaStreamSource(micStream);
        processor = audioCtx.createScriptProcessor(4096, 1, 1);
        source.connect(processor);
        processor.connect(audioCtx.destination);

        processor.onaudioprocess = function(e) {
            if (!isRecording) return;
            const inputData = e.inputBuffer.getChannelData(0);
            let chunk16k = inputData;
            if (audioCtx.sampleRate !== 16000) {
                const ratio = audioCtx.sampleRate / 16000;
                chunk16k = new Float32Array(Math.round(inputData.length / ratio));
                for (let i = 0; i < chunk16k.length; i++) chunk16k[i] = inputData[Math.floor(i * ratio)];
            }
            for (let i = 0; i < chunk16k.length; i++) audioDataBuffer.push(chunk16k[i]);
        };
    }

    function stopRec() {
        if (!isRecording) return;
        isRecording = false; clearTimeout(recTimer);
        if (processor) { processor.disconnect(); processor = null; }

        $('rec-1s').innerText = "1 Sec"; $('rec-3s').innerText = "3 Sec"; $('rec-cont').innerText = "Continuous";
        document.querySelectorAll('.rec-btn').forEach(b => { b.disabled = false; b.classList.remove('recording'); });
        document.querySelectorAll('.lbl-btn').forEach(b => b.disabled = false);

        if (audioDataBuffer.length > 0) processAndSaveWav(new Float32Array(audioDataBuffer));
    }

    function processAndSaveWav(float32Array) {
        const numSamples = float32Array.length;
        const buffer = new ArrayBuffer(44 + numSamples * 2);
        const view = new DataView(buffer);
        const writeStr = (off, str) => { for (let i=0; i<str.length; i++) view.setUint8(off+i, str.charCodeAt(i)); };
        
        writeStr(0, 'RIFF'); view.setUint32(4, 36 + numSamples * 2, true); writeStr(8, 'WAVE'); writeStr(12, 'fmt ');
        view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
        view.setUint32(24, 16000, true); view.setUint32(28, 16000 * 2, true);
        view.setUint16(32, 2, true); view.setUint16(34, 16, true);
        writeStr(36, 'data'); view.setUint32(40, numSamples * 2, true);

        for (let i = 0; i < numSamples; i++) {
            let s = Math.max(-1, Math.min(1, float32Array[i]));
            view.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
        }

        const blob = new Blob([buffer], { type: 'audio/wav' });
        const filename = `${currentLabel}.${globalId}.wav`;
        
        globalId++; localStorage.setItem('ei_seq_id', globalId);
        cart.push({ name: filename, blob: blob });
        totalBytes += blob.size;

        logMsg(`✅ Saved: <b>${filename}</b>`);
        updateCartUI();
    }

    function updateCartUI() {
        $('cart-count').innerText = cart.length;
        $('cart-ram').innerText = (totalBytes / 1048576).toFixed(2);
        $('exportBtn').disabled = cart.length === 0;
        $('clearBtn').disabled = cart.length === 0;
    }

    function clearCart() {
        if (confirm("Delete all unsaved recordings?")) { cart.length = 0; totalBytes = 0; updateCartUI(); logMsg("🗑️ Cart Cleared."); }
    }

    async function exportZip() {
        if (cart.length === 0) return;
        $('exportBtn').innerText = "Zipping..."; $('exportBtn').disabled = true;
        logMsg("📦 Bundling " + cart.length + " files into ZIP...");
        
        try {
            let zip = new JSZip();
            cart.forEach(item => { zip.file(item.name, item.blob); });
            let content = await zip.generateAsync({ type: "blob" });
            let filename = `Dataset_${Date.now()}.zip`;
            let file = new File([content], filename, { type: "application/zip" });

            if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                await navigator.share({ files: [file], title: 'Skeet AI Dataset' });
                logMsg(`✅ <b>Success!</b> Sent to iOS Share menu.`);
            } else {
                let url = URL.createObjectURL(content);
                let a = document.createElement("a");
                a.href = url; a.download = filename; a.click();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
                logMsg(`✅ <b>Success!</b> Used fallback download.`);
            }
            cart.length = 0; totalBytes = 0; updateCartUI();
        } catch (e) { logMsg("❌ ZIP Error: " + e.message); } 
        finally { $('exportBtn').innerText = "Export ZIP to Files"; $('exportBtn').disabled = false; }
    }
</script>
</body>
</html>
