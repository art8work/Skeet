<!DOCTYPE html>
<html>
<head>
    <title>AI Skeet Puller V19.21</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="edge-impulse-standalone.js"></script>
    <style>
        body { font-family: Arial; text-align: center; margin-top: 15px; background: #222; color: white;}
        .top-row { display: flex; justify-content: center; gap: 8px; margin: 8px 3%; }
        .top-btn { flex: 1; padding: 12px 2px; font-size: 16px; border-radius: 8px; font-weight: bold; border:none; cursor: pointer; transition: background 0.3s;}
        #arm-status { font-size: 18px; font-weight: bold; color: #aaa; margin: 10px 0; min-height: 24px;}
        #arm-panel { display: flex; justify-content: center; margin: 8px 2%; flex-wrap: wrap; gap: 6px; }
        .arm-btn { flex: 1 1 22%; padding: 12px 0px; font-size: 16px; font-weight: bold; background: #444; color: white; border: 2px solid #222; border-radius: 8px; cursor: pointer;}
        .arm-btn.active { background: #e74c3c; border-color: #ffeb3b; color: white;} 
        .cancel-btn { background: #8b0000; color: #fff; border-color: #ff4444; }
        .delay-row { display: flex; justify-content: space-between; align-items: center; margin: 8px 5%; background: #333; padding: 6px 12px; border-radius: 8px; }
        .delay-label { font-size: 15px; font-weight: bold;}
        .delay-btn { background: #555; color: white; border: none; padding: 6px 16px; font-size: 18px; border-radius: 5px; font-weight: bold; cursor: pointer;}
        .delay-val { font-size: 16px; font-weight: bold; width: 45px; display: inline-block; text-align: center; color: #00d2ff;}
        #vol-bar-container { width: 90%; height: 18px; background: #444; margin: 12px auto 4px; border-radius: 9px; overflow: hidden; }
        #vol-bar { width: 0%; height: 100%; background: #0f0; transition: width 0.05s, background 0.2s; }
        #ai-confidence { font-size: 16px; font-weight: bold; color: #0f0; margin: 4px 0; min-height: 20px; }
        /* Live label scores bar */
        #label-scores { font-size: 11px; color: #aaa; margin: 2px 0 4px; min-height: 14px; letter-spacing: 0.5px; }
        #threshLabel { font-size: 14px; }
        #threshVal { font-size: 13px; font-weight: bold; color: #ffeb3b; }
        #md-display { font-size: 14px; color: #aaa; margin-top: 5px; font-weight: bold; transition: color 0.2s;}
        #log { margin-top: 15px; color: #0f0; text-align: left; padding: 8px; font-size: 12px; background: #111; height: 150px; overflow-y: scroll; border: 1px solid #444;}
        #ai-status-row { font-size: 12px; color: #888; margin: 2px 0; }
    </style>
</head>
<body>

    <h2>AI Puller V19.21 (Edge Impulse)</h2>
    
    <div class="top-row">
        <button id="connectBtn" class="top-btn" style="background: #007BFF; color: white;">Connect BLE</button>
        <button id="listenBtn" class="top-btn" style="background: #28A745; color: white;">Turn On Mic</button>
    </div>
    <div class="top-row">
        <button id="vmBtn" class="top-btn" style="background: #9b59b6; color: white;">Mode: VOICE</button>
        <button id="syncBtn" class="top-btn" style="background: #17a2b8; color: white;">Sync: ON</button>
    </div>
    <div class="top-row">
        <button id="aiBtn" class="top-btn" style="background: #27ae60; color: white;">AI: ON</button>
        <button id="dumpBtn" class="top-btn" style="background: #e67e22; color: white;">🔍 Dump</button>
    </div>
    
    <div id="arm-status">SAFE / DISARMED</div>

    <div id="arm-panel">
        <button id="btn-H" class="arm-btn" onclick="setMode('H')">H</button>
        <button id="btn-L" class="arm-btn" onclick="setMode('L')">L</button>
        <button id="btn-D" class="arm-btn" onclick="setMode('D')">D</button>
        <button id="btn-DR" class="arm-btn" onclick="setMode('DR')">DR</button>
        <button id="btn-HL" class="arm-btn" onclick="setMode('HL')">HL</button>
        <button id="btn-LH" class="arm-btn" onclick="setMode('LH')">LH</button>
        <button id="btn-T" class="arm-btn" onclick="setMode('T')">T (H)</button>
        <button id="btn-CANCEL" class="arm-btn cancel-btn" onclick="cancelMode()">CANCEL</button>
    </div>

    <div class="delay-row">
        <span class="delay-label">Delay (D):</span>
        <div>
            <button class="delay-btn" onclick="adjDelay('D', -0.1)">-</button>
            <span class="delay-val" id="val-D">0.0s</span>
            <button class="delay-btn" onclick="adjDelay('D', 0.1)">+</button>
        </div>
    </div>
    <div class="delay-row">
        <span class="delay-label">Dbl Dly (DD):</span>
        <div>
            <button class="delay-btn" onclick="adjDelay('DD', -0.1)">-</button>
            <span class="delay-val" id="val-DD">0.0s</span>
            <button class="delay-btn" onclick="adjDelay('DD', 0.1)">+</button>
        </div>
    </div>

    <div id="vol-bar-container"><div id="vol-bar"></div></div>
    <div id="ai-confidence">AI: Waiting for engine...</div>
    <!-- Live scores for ALL labels — updated every inference, no log spam -->
    <div id="label-scores">—</div>
    <div id="ai-status-row">Engine not loaded</div>

    <label id="threshLabel" for="threshSlider">AI Threshold %: <span id="threshVal">40</span></label><br>
    <input type="range" id="threshSlider" min="5" max="95" value="40" style="width: 80%; margin-top: 5px;">

    <div id="md-display">Mute Delay (MD): 500ms</div>
    <div id="log">--- Debug Log ---<br></div>

<script>
    const SERVICE_UUID  = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const CHAR_RX_UUID  = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
    const CHAR_TX_UUID  = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

    let bleDevice, bleCharacteristic, bleTxCharacteristic;
    let isBleConnected = false;

    // micState: 0=ready, 1=triggered/lockout, 2=waiting for quiet
    let micState = 0;
    let isMicActive = false;
    let wasMicActiveBeforeSleep = false;
    let audioContext, audioStream, animId;

    let classifierInitialized = false;
    let aiProcessor = null;
    let audioDataBuffer = [];

    // Threshold is now a direct % (slider 5–95 maps to 0.05–0.95)
    let threshold = 40;
    let isSyncEnabled = true;
    let isVoiceMode   = true;
    let armedMode     = null;
    let hlStep        = 0;
    let lastHouse     = 'H';
    let dVal          = 0.0;
    let ddVal         = 0.0;
    let muteDelay     = 500;

    function logMsg(msg) {
        const logDiv = document.getElementById('log');
        logDiv.innerHTML = msg + "<br>" + logDiv.innerHTML;
    }

    document.getElementById('threshSlider').oninput = function() {
        threshold = parseInt(this.value);
        document.getElementById('threshVal').innerText = threshold;
    };

    // =========================================================
    // EDGE IMPULSE — correct heap-copy pattern
    // =========================================================
    let isAiEnabled  = true;
    let eiClassifier = null;

    class EdgeImpulseClassifier {
        _initialized = false;

        init() {
            return new Promise((resolve) => {
                // calledRun = true means WASM already finished loading
                if (window.Module && window.Module.calledRun === true) {
                    this._initialized = true;
                    resolve();
                    return;
                }
                // Chain onto existing callback rather than overwriting it
                const prev = window.Module ? window.Module.onRuntimeInitialized : null;
                window.Module = window.Module || {};
                window.Module.onRuntimeInitialized = () => {
                    if (typeof prev === 'function') prev();
                    this._initialized = true;
                    resolve();
                };
            });
        }

        classify(rawData, debug = false) {
            if (!this._initialized) throw new Error('Not initialized');
            const obj = this._arrayToHeap(rawData);
            let ret   = Module.run_classifier(obj.buffer.byteOffset, rawData.length, debug);
            Module._free(obj.ptr);
            if (ret.result !== 0) throw new Error('run_classifier failed: ' + ret.result);
            let out = { anomaly: ret.anomaly, results: [] };
            for (let i = 0; i < ret.size(); i++) {
                let c = ret.get(i);
                out.results.push({ label: c.label, value: c.value });
            }
            return out;
        }

        _arrayToHeap(data) {
            const f32      = new Float32Array(data);
            const nBytes   = f32.length * f32.BYTES_PER_ELEMENT;
            const ptr      = Module._malloc(nBytes);
            const heap     = new Uint8Array(Module.HEAPU8.buffer, ptr, nBytes);
            heap.set(new Uint8Array(f32.buffer));
            return { ptr, buffer: heap };
        }
    }

    function dumpModule() {
        if (!window.Module) { logMsg("❌ window.Module undefined"); return; }
        let fns = Object.keys(window.Module).filter(k => typeof window.Module[k] === 'function');
        logMsg("📦 fns: " + (fns.join(', ') || '(none)'));
        logMsg("📦 calledRun=" + window.Module.calledRun + " ready=" + classifierInitialized);
        if (eiClassifier && classifierInitialized) {
            try {
                let r = eiClassifier.classify(new Float32Array(16000), false);
                logMsg("🔬 dummy: " + JSON.stringify(r).substring(0, 300));
            } catch(e) { logMsg("🔬 err: " + e); }
        }
    }

    async function initEiClassifier() {
        try {
            eiClassifier = new EdgeImpulseClassifier();
            await eiClassifier.init();
            classifierInitialized = true;
            logMsg("✅ AI Engine Ready!");
            document.getElementById('ai-status-row').innerText = "AI engine loaded ✅";
            document.getElementById('ai-confidence').innerText = "AI Confidence: —";
        } catch(e) {
            logMsg("❌ AI init failed: " + e);
            document.getElementById('ai-status-row').innerText = "AI failed — volume mode active";
            document.getElementById('ai-confidence').innerText = "Volume detection active";
        }
    }
    initEiClassifier();

    // =========================================================
    // INFERENCE
    // Label name from model is unknown — we use the TOP scoring label
    // and also show ALL labels live so user can see exact names + scores
    // =========================================================

    // Set this to your exact label name after you see it in the log below.
    // Leave as null to auto-detect (uses whichever label scores highest).
    let targetLabel = "pull"; // matched case-insensitively against model labels

    function runAiInference(dataArray) {
        if (!classifierInitialized || !eiClassifier || !isAiEnabled) return;
        try {
            let result = eiClassifier.classify(dataArray, false);

            if (!result || !result.results || result.results.length === 0) {
                logMsg("⚠️ Empty result from classifier");
                return;
            }

            // Log raw result EVERY 3 seconds so label names are always visible
            if (!runAiInference._lastLog || Date.now() - runAiInference._lastLog > 3000) {
                runAiInference._lastLog = Date.now();
                logMsg("🔬 Labels: " + result.results.map(r => r.label + "=" + Math.round(r.value*100) + "%").join("  "));
            }

            // Build live score display
            let scoreStr = result.results.map(r => r.label + ":" + Math.round(r.value*100) + "%").join("  ");
            document.getElementById('label-scores').innerText = scoreStr;

            // Find the target label score — auto-detect uses label[0] (first = positive class in EI)
            // or whichever label matches targetLabel if set
            let triggerScore = null;
            let triggerLabelName = '';

            if (targetLabel) {
                // Use exact named label
                for (let r of result.results) {
                    if (r.label.toLowerCase() === targetLabel.toLowerCase()) {
                        triggerScore = r.value;
                        triggerLabelName = r.label;
                        break;
                    }
                }
            } else {
                // Auto: use label[0] — in Edge Impulse the first label is usually
                // the positive class you trained for. Log it so user can confirm.
                triggerScore = result.results[0].value;
                triggerLabelName = result.results[0].label;
            }

            if (triggerScore === null) {
                logMsg("⚠️ Target label not found. Labels are: " + result.results.map(r=>r.label).join(", "));
                return;
            }

            let pct         = Math.round(triggerScore * 100);
            let aiThreshold = threshold / 100;

            document.getElementById('ai-confidence').innerText =
                "AI [" + triggerLabelName + "]: " + pct + "%  (need " + threshold + "%)";
            document.getElementById('ai-confidence').style.color = (triggerScore >= aiThreshold) ? "#f00" : "#0f0";

            if (triggerScore >= aiThreshold && isVoiceMode) {
                if (micState === 0 && armedMode) {
                    processVoiceTrigger(pct, true);
                } else {
                    if (!runAiInference._blockLog || Date.now() - runAiInference._blockLog > 1500) {
                        runAiInference._blockLog = Date.now();
                        let why = [];
                        if (micState !== 0) why.push("micState=" + micState + " (locked/cooling)");
                        if (!armedMode)     why.push("NOT ARMED — tap H/L/D/etc");
                        if (!isVoiceMode)   why.push("not in VOICE mode");
                        logMsg("⚡ " + pct + "% exceeds threshold but BLOCKED: " + why.join(", "));
                    }
                }
            } else if (micState === 2 && triggerScore < (aiThreshold * 0.5)) {
                micState = 0;
                document.getElementById('vol-bar').style.background = "#0f0";
                logMsg("🟢 Ready.");
            }

        } catch (err) {
            if (!runAiInference._errCount) runAiInference._errCount = 0;
            if (++runAiInference._errCount <= 5) logMsg("⚠️ Inference error: " + err);
        }
    }

    // =========================================================
    // MIC
    // =========================================================
    async function startMic() {
        if (classifierInitialized) logMsg("🧠 AI mode active.");
        else logMsg("⏳ AI not ready — volume fallback active.");

        try {
            audioStream  = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            window.AudioContext = window.AudioContext || window.webkitAudioContext;
            audioContext = new window.AudioContext({ sampleRate: 16000 });
            if (audioContext.state === 'suspended') await audioContext.resume();
            if (audioContext.state !== 'running')  { logMsg("ERROR: AudioContext failed."); return; }

            isMicActive = true;
            document.getElementById('listenBtn').innerText = "Mute Mic 🎤";
            document.getElementById('listenBtn').style.background = "#dc3545";
            logMsg("Mic on @ " + audioContext.sampleRate + "Hz");

            const source   = audioContext.createMediaStreamSource(audioStream);
            const analyser = audioContext.createAnalyser();
            analyser.fftSize = 256;
            source.connect(analyser);
            const freqData = new Uint8Array(analyser.frequencyBinCount);

            aiProcessor = audioContext.createScriptProcessor(4096, 1, 1);
            source.connect(aiProcessor);
            aiProcessor.connect(audioContext.destination);

            // Log actual sample rate once so we can confirm iOS behavior
            logMsg("🎙️ Actual AudioContext sampleRate: " + audioContext.sampleRate + "Hz");

            // How many NATIVE samples = 1 second of audio at 16kHz after downsampling
            // If iOS runs at 44100, we need 44100 raw samples to produce 16000 downsampled
            const nativeSampleRate  = audioContext.sampleRate;
            const targetSampleRate  = 16000;
            const needNativeSamples = (nativeSampleRate !== targetSampleRate)
                ? Math.round(nativeSampleRate)          // 1 second worth of native samples
                : 16000;
            const slideNativeSamples = Math.round(needNativeSamples * 0.25); // slide 250ms

            aiProcessor.onaudioprocess = function(e) {
                if (!isMicActive || micState === 1) return;

                const inputData = e.inputBuffer.getChannelData(0);

                // Push raw native-rate samples into buffer
                for (let i = 0; i < inputData.length; i++) {
                    audioDataBuffer.push(inputData[i]);
                }

                // Once we have 1 full second of NATIVE samples, downsample then infer
                if (audioDataBuffer.length >= needNativeSamples) {
                    const nativeSlice = audioDataBuffer.slice(0, needNativeSamples);

                    // Downsample to 16kHz if needed
                    let processed;
                    if (nativeSampleRate !== targetSampleRate) {
                        const ratio  = nativeSampleRate / targetSampleRate;
                        const newLen = 16000; // always exactly 16000 output samples
                        processed    = new Float32Array(newLen);
                        for (let i = 0; i < newLen; i++) {
                            processed[i] = nativeSlice[Math.floor(i * ratio)];
                        }
                    } else {
                        processed = new Float32Array(nativeSlice);
                    }

                    // DC offset removal on the downsampled data
                    let mean = 0;
                    for (let i = 0; i < processed.length; i++) mean += processed[i];
                    mean /= processed.length;
                    for (let i = 0; i < processed.length; i++) {
                        processed[i] -= mean;
                        if (processed[i] >  1) processed[i] =  1;
                        if (processed[i] < -1) processed[i] = -1;
                    }

                    if (classifierInitialized) runAiInference(processed);

                    // Slide the native buffer by 250ms worth of native samples
                    audioDataBuffer = audioDataBuffer.slice(slideNativeSamples);
                }
            };

            // Volume bar animation loop
            function checkVolume() {
                if (!isMicActive) return;
                analyser.getByteFrequencyData(freqData);
                let sum = 0;
                for (let i = 0; i < freqData.length; i++) sum += freqData[i];
                let avgVol = sum / freqData.length;
                document.getElementById('vol-bar').style.width = Math.min(100, (avgVol / 1.5)) + "%";

                // Volume fallback: fires when AI is OFF or not loaded
                if (!classifierInitialized || !isAiEnabled) {
                    if (micState === 0 && avgVol > threshold && isVoiceMode) {
                        processVoiceTrigger(avgVol, false);
                    } else if (micState === 2 && avgVol < (threshold * 0.8)) {
                        micState = 0;
                        document.getElementById('vol-bar').style.background = "#0f0";
                        logMsg("🟢 Quiet. Ready.");
                    }
                }
                animId = requestAnimationFrame(checkVolume);
            }
            checkVolume();
            logMsg("✅ Mic ready.");

        } catch (err) { logMsg("Mic Error: " + (err.message || err)); stopMic(true); }
    }

    function stopMic(resetUI = true) {
        if (aiProcessor)  { aiProcessor.disconnect(); aiProcessor = null; }
        if (audioStream)  audioStream.getTracks().forEach(t => t.stop());
        if (audioContext && audioContext.state !== 'closed') audioContext.close();
        if (animId)       cancelAnimationFrame(animId);
        audioDataBuffer = [];
        isMicActive = false; micState = 0;
        if (resetUI) {
            document.getElementById('listenBtn').innerText = "Turn On Mic";
            document.getElementById('listenBtn').style.background = "#28A745";
            document.getElementById('vol-bar').style.background = "#0f0";
            document.getElementById('vol-bar').style.width = "0%";
            document.getElementById('md-display').style.color = "#aaa";
            document.getElementById('ai-confidence').innerText = "AI: —";
            document.getElementById('label-scores').innerText = "—";
            logMsg("Mic off.");
        }
    }

    document.getElementById('listenBtn').addEventListener('click', async () => {
        if (isMicActive || wasMicActiveBeforeSleep) { wasMicActiveBeforeSleep = false; stopMic(true); }
        else { wasMicActiveBeforeSleep = false; startMic(); }
    });

    // iOS mic health watch
    document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
            if (isMicActive) {
                wasMicActiveBeforeSleep = true; stopMic(false);
                document.getElementById('listenBtn').innerText = "Mic Paused 💤";
                document.getElementById('listenBtn').style.background = "#f39c12";
            }
        } else {
            if (wasMicActiveBeforeSleep) { wasMicActiveBeforeSleep = false; logMsg("Woke. Resuming mic..."); startMic(); }
        }
    });

    setInterval(() => {
        if (isMicActive && !document.hidden) {
            let trackOk   = audioStream && audioStream.getTracks()[0]?.readyState === 'live';
            let contextOk = audioContext && audioContext.state === 'running';
            if (!trackOk || !contextOk) { logMsg("⚠️ iOS killed mic. Resetting."); stopMic(true); }
        }
    }, 1500);

    // =========================================================
    // TRIGGER
    // =========================================================
    async function processVoiceTrigger(level, isAi) {
        if (!armedMode || micState !== 0) return;
        micState = 1;
        document.getElementById('vol-bar').style.background = "#f00";
        document.getElementById('md-display').style.color = "#ff4444";

        let cmdToSend = '';
        if      (armedMode === 'H' || armedMode === 'L') { cmdToSend = armedMode; cancelMode(false); }
        else if (armedMode === 'D')  { cmdToSend = 'D1H'; cancelMode(false); }
        else if (armedMode === 'DR') { cmdToSend = 'D1L'; cancelMode(false); }
        else if (armedMode === 'HL') {
            if (hlStep === 0) { cmdToSend = 'H'; hlStep = 1; document.getElementById('arm-status').innerText = "ARMED: Now Pulling Low"; }
            else              { cmdToSend = 'L'; hlStep = 0; cancelMode(false); }
        }
        else if (armedMode === 'LH') {
            if (hlStep === 0) { cmdToSend = 'L'; hlStep = 1; document.getElementById('arm-status').innerText = "ARMED: Now Pulling High"; }
            else              { cmdToSend = 'H'; hlStep = 0; cancelMode(false); }
        }
        else if (armedMode === 'T') {
            if      (lastHouse === 'HL') { cmdToSend = (hlStep===0)?'H':'L'; hlStep=(hlStep===0)?1:0; }
            else if (lastHouse === 'LH') { cmdToSend = (hlStep===0)?'L':'H'; hlStep=(hlStep===0)?1:0; }
            else if (lastHouse === 'D')  cmdToSend = 'D1H';
            else if (lastHouse === 'DR') cmdToSend = 'D1L';
            else cmdToSend = lastHouse;
        }

        updateArmUI();
        let totalLockout = (dVal * 1000) + muteDelay;
        logMsg(`💥 FIRED! (${isAi ? 'AI '+Math.round(level)+'%' : 'Vol '+Math.round(level)}) Lockout:${totalLockout}ms`);
        if (cmdToSend !== '') await sendBLECmd(cmdToSend);

        setTimeout(() => {
            micState = 2;
            audioDataBuffer = [];
            document.getElementById('vol-bar').style.background = "#f39c12";
            document.getElementById('md-display').style.color = "#aaa";
            logMsg("Lockout over. Waiting for quiet...");
        }, totalLockout);
    }

    // =========================================================
    // UI
    // =========================================================
    document.getElementById('syncBtn').addEventListener('click', () => {
        isSyncEnabled = !isSyncEnabled;
        const btn = document.getElementById('syncBtn');
        btn.innerText = isSyncEnabled ? "Sync: ON" : "Sync: OFF";
        btn.style.background = isSyncEnabled ? "#17a2b8" : "#6c757d";
        logMsg(isSyncEnabled ? "Sync ON." : "Sync OFF.");
    });

    document.getElementById('vmBtn').addEventListener('click', () => { setVoiceMode(!isVoiceMode, false); });
    document.getElementById('dumpBtn').addEventListener('click', dumpModule);

    document.getElementById('aiBtn').addEventListener('click', () => {
        isAiEnabled = !isAiEnabled;
        const btn = document.getElementById('aiBtn');
        if (isAiEnabled) {
            btn.innerText = "AI: ON"; btn.style.background = "#27ae60";
            document.getElementById('ai-confidence').innerText = classifierInitialized ? "AI Confidence: —" : "AI: engine not loaded";
            logMsg("🧠 AI ON.");
        } else {
            btn.innerText = "AI: OFF (Vol)"; btn.style.background = "#6c757d";
            document.getElementById('ai-confidence').innerText = "AI off — volume mode";
            document.getElementById('label-scores').innerText = "—";
            logMsg("🔇 AI OFF. Volume trigger active.");
        }
    });

    function setVoiceMode(voiceEnabled, fromSync = false) {
        isVoiceMode = voiceEnabled;
        const btn = document.getElementById('vmBtn');
        if (isVoiceMode) { btn.innerText = "Mode: VOICE";  btn.style.background = "#9b59b6"; }
        else             { btn.innerText = "Mode: MANUAL"; btn.style.background = "#fd7e14"; cancelMode(true); }
        updateArmUI();
        if (!fromSync && isBleConnected && isSyncEnabled) sendBLECmd(isVoiceMode ? "MODE:VOICE" : "MODE:MANUAL", true);
    }

    window.adjDelay = function(type, amt) {
        if (!isBleConnected) return;
        if (type === 'D')  { dVal  = Math.max(0, dVal+amt);  document.getElementById('val-D').innerText  = dVal.toFixed(1)+"s";  sendBLECmd("D"+dVal.toFixed(1)); }
        else               { ddVal = Math.max(0, ddVal+amt); document.getElementById('val-DD').innerText = ddVal.toFixed(1)+"s"; sendBLECmd("DD"+ddVal.toFixed(1)); }
    };

    function updateArmUI() {
        document.querySelectorAll('.arm-btn').forEach(b => b.classList.remove('active'));
        const as = document.getElementById('arm-status');
        document.getElementById('btn-T').innerText = "T (" + lastHouse + ")";
        if (!isVoiceMode) { as.innerText = "MANUAL MODE (Tap to Fire)"; as.style.color = "#fd7e14"; return; }
        if (armedMode) document.getElementById('btn-' + armedMode).classList.add('active');
        if (!armedMode) { as.innerText = "SAFE / DISARMED"; as.style.color = "#aaa"; }
        else {
            as.style.color = "#ff4444";
            if      (armedMode === 'HL') as.innerText = hlStep===0 ? "ARMED: High -> Low" : "ARMED: Now Pulling Low";
            else if (armedMode === 'LH') as.innerText = hlStep===0 ? "ARMED: Low -> High" : "ARMED: Now Pulling High";
            else if (armedMode === 'T')  as.innerText = "REPEATING: " + lastHouse;
            else                         as.innerText = "ARMED: " + armedMode;
        }
    }

    window.cancelMode = function(fromSync = false) {
        armedMode = null; hlStep = 0; micState = 0;
        document.getElementById('vol-bar').style.background = "#0f0";
        document.getElementById('md-display').style.color = "#aaa";
        updateArmUI();
        if (!fromSync) logMsg(isVoiceMode ? "🚫 SAFE." : "🔄 Reset.");
        if (!fromSync && isBleConnected && isSyncEnabled) sendBLECmd("MODE:CANCEL", true);
    };

    window.setMode = function(mode, fromSync = false) {
        if (!isVoiceMode && !fromSync) {
            let cmd = '';
            if      (mode==='H'||mode==='L') { cmd=mode; hlStep=0; lastHouse=mode; }
            else if (mode==='D')  { cmd='D1H'; hlStep=0; lastHouse='D'; }
            else if (mode==='DR') { cmd='D1L'; hlStep=0; lastHouse='DR'; }
            else if (mode==='HL') { lastHouse='HL'; cmd=(hlStep===0)?'H':'L'; hlStep=(hlStep===0)?1:0; }
            else if (mode==='LH') { lastHouse='LH'; cmd=(hlStep===0)?'L':'H'; hlStep=(hlStep===0)?1:0; }
            else if (mode==='T') {
                if      (lastHouse==='HL') { cmd=(hlStep===0)?'H':'L'; hlStep=(hlStep===0)?1:0; }
                else if (lastHouse==='LH') { cmd=(hlStep===0)?'L':'H'; hlStep=(hlStep===0)?1:0; }
                else if (lastHouse==='D')  cmd='D1H';
                else if (lastHouse==='DR') cmd='D1L';
                else cmd=lastHouse;
            }
            if (cmd) {
                sendBLECmd(cmd);
                if (isSyncEnabled) sendBLECmd("MODE:MAN_UPDATE:"+lastHouse+":"+hlStep, true);
                const b = document.getElementById('btn-'+mode);
                if (b) { b.classList.add('active'); setTimeout(()=>b.classList.remove('active'),200); }
                updateArmUI();
            }
            return;
        }
        if (!fromSync) {
            if (armedMode===mode) armedMode=null;
            else { armedMode=mode; if(mode!=='T'&&mode!=='CANCEL') lastHouse=mode; }
        } else {
            armedMode=mode; if(mode!=='T'&&mode!==null&&mode!=='CANCEL') lastHouse=mode;
        }
        hlStep=0; updateArmUI();
        if (!fromSync&&isBleConnected&&isSyncEnabled&&isVoiceMode)
            sendBLECmd(armedMode?"MODE:"+armedMode+":"+lastHouse:"MODE:CANCEL", true);
    };

    // =========================================================
    // BLE
    // =========================================================
    document.getElementById('connectBtn').addEventListener('click', async () => {
        if (isBleConnected) { if (bleDevice?.gatt.connected) bleDevice.gatt.disconnect(); return; }
        try {
            logMsg("Searching...");
            bleDevice = await navigator.bluetooth.requestDevice({ filters:[{name:'BLUE Puller'}], optionalServices:[SERVICE_UUID] });
            bleDevice.addEventListener('gattserverdisconnected', handleBleDisconnect);
            const server  = await bleDevice.gatt.connect();
            const service = await server.getPrimaryService(SERVICE_UUID);
            bleCharacteristic   = await service.getCharacteristic(CHAR_RX_UUID);
            bleTxCharacteristic = await service.getCharacteristic(CHAR_TX_UUID);
            await bleTxCharacteristic.startNotifications();
            bleTxCharacteristic.addEventListener('characteristicvaluechanged', handleBleNotifications);
            isBleConnected = true;
            document.getElementById('connectBtn').innerText = "Disconnect BLE";
            document.getElementById('connectBtn').style.background = "#dc3545";
            logMsg("BLE Connected!"); setTimeout(()=>sendBLECmd("?"),500);
        } catch(e) { logMsg("BLE Error: "+e); }
    });

    function handleBleDisconnect() {
        isBleConnected=false; bleCharacteristic=null; bleTxCharacteristic=null;
        document.getElementById('connectBtn').innerText="Connect BLE";
        document.getElementById('connectBtn').style.background="#007BFF";
        logMsg("BLE Disconnected.");
    }

    function handleBleNotifications(event) {
        let msg = new TextDecoder('utf-8').decode(event.target.value).trim();
        if (!msg || msg.startsWith("Err: Unknown")) return;

        if (msg==="GLOVE: CONNECTED") {
            logMsg("🤝 Glove joined."); sendBLECmd("ACK:GLOVE",true);
            if (isSyncEnabled) setTimeout(()=>sendBLECmd(isVoiceMode?"MODE:VOICE":"MODE:MANUAL",true),600);
            return;
        }
        if (msg==="AH")     { sendBLECmd("ACK:AH",true);     setTimeout(()=>setMode('H',true),400); return; }
        if (msg==="AL")     { sendBLECmd("ACK:AL",true);     setTimeout(()=>setMode('L',true),400); return; }
        if (msg==="AD")     { sendBLECmd("ACK:AD",true);     setTimeout(()=>setMode('D',true),400); return; }
        if (msg==="CANCEL") { sendBLECmd("ACK:CANCEL",true); setTimeout(()=>cancelMode(true),400); return; }

        if (msg.startsWith("MODE:")) {
            if (!isSyncEnabled) return;
            if (msg==="MODE:VOICE")  { setVoiceMode(true,true);  return; }
            if (msg==="MODE:MANUAL") { setVoiceMode(false,true); return; }
            let parts=msg.split(":"), st=parts[1];
            if (st==="MAN_UPDATE") { lastHouse=parts[2]; if(parts[3]) hlStep=parseInt(parts[3]); updateArmUI(); return; }
            if (parts[2]) lastHouse=parts[2];
            if (st==="CANCEL") cancelMode(true); else setMode(st,true);
            return;
        }

        if (msg.includes("Delay Set:"))   { let m=msg.match(/Delay Set: ([\d.]+)/);   if(m){dVal=parseFloat(m[1]);   document.getElementById('val-D').innerText=dVal.toFixed(1)+"s";} }
        if (msg.includes("Dbl Dly Set:")) { let m=msg.match(/Dbl Dly Set: ([\d.]+)/); if(m){ddVal=parseFloat(m[1]);  document.getElementById('val-DD').innerText=ddVal.toFixed(1)+"s";} }
        if (msg.includes("MD Set:"))      { let m=msg.match(/MD Set: (\d+)/);          if(m){muteDelay=parseInt(m[1]);document.getElementById('md-display').innerText="Mute Delay (MD): "+muteDelay+"ms";} }
        if (msg.includes("STATUS:")) {
            let d=msg.match(/Delay: ([\d.]+)/),dd=msg.match(/Dbl: ([\d.]+)/),md=msg.match(/MD: (\d+)/);
            if(d)  { dVal=parseFloat(d[1]);    document.getElementById('val-D').innerText=dVal.toFixed(1)+"s"; }
            if(dd) { ddVal=parseFloat(dd[1]);  document.getElementById('val-DD').innerText=ddVal.toFixed(1)+"s"; }
            if(md) { muteDelay=parseInt(md[1]);document.getElementById('md-display').innerText="Mute Delay (MD): "+muteDelay+"ms"; }
        }

        logMsg("📡 [TRAP]: "+msg);
        if      (msg==="CMD: High")                        { lastHouse='H';  updateArmUI(); }
        else if (msg==="CMD: Low")                         { lastHouse='L';  updateArmUI(); }
        else if (msg==="CMD: D1H"||msg==="CMD: Doubles")   { lastHouse='D';  updateArmUI(); }
        else if (msg==="CMD: D1L")                         { lastHouse='DR'; updateArmUI(); }
    }

    async function sendBLECmd(cmd, silent=false) {
        if (bleCharacteristic && isBleConnected) {
            try {
                await bleCharacteristic.writeValue(new TextEncoder().encode(cmd));
                if (!silent) logMsg("🚀 SENT: '"+cmd+"'");
            } catch(e) { logMsg("BLE Send Failed: "+e); }
        }
    }
</script>
</body>
</html>
