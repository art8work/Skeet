<!DOCTYPE html>
<html>
<head>
    <title>AI Skeet Puller V29</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="edge-impulse-standalone.js?v=29"></script>
    <style>
        body { font-family: Arial; text-align: center; margin-top: 10px; background: #222; color: white;}
        .row { display: flex; justify-content: center; gap: 6px; margin: 6px 2%; flex-wrap: wrap;}
        button { padding: 12px; font-size: 16px; border-radius: 8px; font-weight: bold; border:none; cursor: pointer;}
        .top-btn { flex: 1; } .arm-btn { flex: 1 1 22%; background: #444; color: white;}
        .arm-btn.active { background: #e74c3c; color: white; }
        #arm-status { font-size: 18px; font-weight: bold; color: #aaa; margin: 8px 0; }
        .delay-row { display: flex; justify-content: space-between; align-items: center; margin: 6px 5%; background: #333; padding: 6px 12px; border-radius: 8px; }
        .delay-btn { background: #555; color: white; padding: 4px 14px; font-size: 18px; border-radius: 5px;}
        #vol-bar-container { width: 90%; height: 18px; background: #444; margin: 10px auto 4px; border-radius: 9px; overflow: hidden; }
        #vol-bar { width: 0%; height: 100%; background: #0f0; transition: width 0.05s; }
        #ai-confidence { font-size: 16px; font-weight: bold; color: #0f0; margin: 4px 0; }
        #label-scores { font-size: 11px; color: #aaa; margin-bottom: 6px; }
        #log { margin-top: 10px; color: #0f0; text-align: left; padding: 8px; font-size: 12px; background: #111; height: 130px; overflow-y: scroll; border: 1px solid #444;}
        
        #adminModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; justify-content: center; align-items: center;}
        .admin-box { background: #333; padding: 20px; border-radius: 10px; width: 80%; max-width: 400px; border: 2px solid #00d2ff;}
        .admin-input { width: 90%; padding: 10px; font-size: 16px; margin: 10px 0; border-radius: 5px; border: 1px solid #ccc; text-align: center;}
        #header-area { display: flex; justify-content: space-between; align-items: center; padding: 0 15px; }
    </style>
</head>
<body>

    <div id="header-area">
        <div id="field-display" style="color:#00d2ff; font-weight:bold; font-size: 18px;">Field: --</div>
        <div style="font-size: 24px; cursor: pointer;" onclick="promptAdmin()">⚙️</div>
    </div>

    <h2 id="appTitle" style="margin-top:0;">AI Puller V29</h2>
    
    <div class="row">
        <button id="connectBtn" class="top-btn" style="background:#007BFF;color:white;">Connect BLE</button>
        <button id="listenBtn" class="top-btn" style="background:#28A745;color:white;">Turn On Mic</button>
    </div>
    <div class="row">
        <button id="vmBtn" class="top-btn" style="background:#9b59b6;color:white;">Mode: VOICE</button>
        <button id="syncBtn" class="top-btn" style="background:#17a2b8;color:white;">Sync: ON</button>
    </div>
    <div class="row">
        <button id="aiBtn" class="top-btn" style="background:#27ae60;color:white;">AI: ON</button>
        <button id="dumpBtn" class="top-btn" style="background:#e67e22;color:white;">🔍 Dump</button>
    </div>
    
    <div id="arm-status">SAFE / DISARMED</div>

    <div class="row" id="arm-panel">
        <button id="btn-H" class="arm-btn" onclick="setMode('H')">H</button>
        <button id="btn-L" class="arm-btn" onclick="setMode('L')">L</button>
        <button id="btn-D" class="arm-btn" onclick="setMode('D')">D</button>
        <button id="btn-DR" class="arm-btn" onclick="setMode('DR')">DR</button>
        <button id="btn-HL" class="arm-btn" onclick="setMode('HL')">HL</button>
        <button id="btn-LH" class="arm-btn" onclick="setMode('LH')">LH</button>
        <button id="btn-T" class="arm-btn" onclick="setMode('T')">T (H)</button>
        <button id="btn-CANCEL" class="arm-btn" style="background:#8b0000;" onclick="cancelMode()">CANCEL</button>
    </div>

    <div class="delay-row"><b>Delay (D):</b>
        <div><button class="delay-btn" onclick="adjDelay('D', -0.1)">-</button> <b id="val-D" style="color:#00d2ff;width:40px;display:inline-block;">0.0s</b> <button class="delay-btn" onclick="adjDelay('D', 0.1)">+</button></div>
    </div>
    <div class="delay-row"><b>Dbl Dly (DD):</b>
        <div><button class="delay-btn" onclick="adjDelay('DD', -0.1)">-</button> <b id="val-DD" style="color:#00d2ff;width:40px;display:inline-block;">0.0s</b> <button class="delay-btn" onclick="adjDelay('DD', 0.1)">+</button></div>
    </div>

    <div id="vol-bar-container"><div id="vol-bar"></div></div>
    <div id="ai-confidence">AI: Waiting for engine...</div>
    <div id="label-scores">—</div>

    <label>AI Confidence Trigger %: <b id="threshVal" style="color:#ffeb3b;">40</b></label><br>
    <input type="range" id="threshSlider" min="5" max="95" value="40" style="width:80%; margin-top:5px;">

    <div id="md-display" style="color:#aaa; font-weight:bold; margin-top:8px;">Mute Delay: 500ms</div>
    <div id="log">--- Debug Log ---<br></div>

    <!-- ADMIN MODAL -->
    <div id="adminModal">
        <div class="admin-box">
            <h3 style="color:#00d2ff;">Maintenance Menu</h3>
            <label>Rename Puller (e.g. Puller F1)</label><br>
            <input type="text" id="newNameInput" class="admin-input" placeholder="Puller Name"><br>
            <button style="background:#28A745; width:100%; margin-top:5px; padding:10px; font-weight:bold; border:none; border-radius:5px; color:white;" onclick="renameDevice()">Save Name & Reboot</button>
            
            <hr style="border-color:#555; margin: 15px 0;">
            
            <label>Set Field Number</label><br>
            <input type="number" id="newFieldInput" class="admin-input" placeholder="Field Number"><br>
            <button style="background:#007BFF; width:100%; margin-top:5px; padding:10px; font-weight:bold; border:none; border-radius:5px; color:white;" onclick="setField()">Save Field</button>
            
            <br><br>
            <button style="background:#888; width:100%; padding:10px; font-weight:bold; border:none; border-radius:5px; color:white;" onclick="document.getElementById('adminModal').style.display='none'">Close</button>
        </div>
    </div>

<script>
    const $ = id => document.getElementById(id);
    const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const CHAR_RX_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
    const CHAR_TX_UUID = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";
    
    let bleDev, rxChar, txChar, isBleConnected = false;
    let micState = 0, isMicActive = false, wasMicActiveBeforeSleep = false;
    let audioContext, audioStream, animId, aiProcessor;
    let audioDataBuffer = new Array(16000).fill(0); 
    
    let isAiEnabled = true, classifierReady = false, threshold = 40;
    let isSyncEnabled = true, isVoiceMode = true;
    let armedMode = null, hlStep = 0, lastHouse = 'H';
    let dVal = 0.0, ddVal = 0.0, muteDelay = 500, fieldId = 1;

    function logMsg(msg) { $('log').innerHTML = msg + "<br>" + $('log').innerHTML; }

    $('threshSlider').oninput = function() {
        threshold = parseInt(this.value); $('threshVal').innerText = threshold;
    };

    // --- ADMIN LOGIC ---
    window.promptAdmin = function() {
        let pin = prompt("Enter Maintenance PIN:");
        if (pin === "3368") $('adminModal').style.display = 'flex';
        else if (pin !== null) alert("Incorrect PIN");
    }
    window.renameDevice = function() {
        if (!isBleConnected) { alert("Must connect BLE first!"); return; }
        let newName = $('newNameInput').value.trim();
        if (newName === "") return;
        sendBLECmd("NAME:" + newName);
        logMsg("⚠️ Device is rebooting...");
        $('adminModal').style.display = 'none';
        setTimeout(() => { if (bleDev && bleDev.gatt.connected) bleDev.gatt.disconnect(); }, 500);
    }
    window.setField = function() {
        if (!isBleConnected) { alert("Must connect BLE first!"); return; }
        let fId = $('newFieldInput').value;
        if (!fId) return;
        sendBLECmd("FIELD:" + fId);
        $('adminModal').style.display = 'none';
    }

    // --- EDGE IMPULSE ---
    let eiClassifier = null; 
    class EdgeImpulseClassifier {
        _initialized = false;
        init() {
            return new Promise((resolve) => {
                if (window.Module && typeof window.Module.run_classifier === 'function') {
                    this._initialized = true; resolve(); return;
                }
                const prev = window.Module ? window.Module.onRuntimeInitialized : null;
                window.Module = window.Module || {};
                window.Module.onRuntimeInitialized = () => {
                    if (typeof prev === 'function') prev();
                    this._initialized = true; resolve();
                };
            });
        }
        classify(rawData) {
            if (!this._initialized) throw new Error('Not initialized');
            const ptr = Module._malloc(rawData.length * 4);
            Module.HEAPF32.set(rawData, ptr >> 2);
            let ret = Module.run_classifier(ptr, rawData.length, false);
            Module._free(ptr);
            if (ret.result !== 0) return null;
            let out =[];
            for (let i = 0; i < ret.size(); i++) {
                let c = ret.get(i); out.push({ label: c.label, value: c.value });
            }
            return out;
        }
    }

    $('dumpBtn').addEventListener('click', () => {
        if (!window.Module) { logMsg("❌ window.Module undefined"); return; }
        logMsg("📦 Ready=" + classifierReady);
        if (eiClassifier && classifierReady) {
            try {
                let r = eiClassifier.classify(new Float32Array(16000));
                logMsg("🔬 Test: " + JSON.stringify(r).substring(0, 150));
            } catch(e) { logMsg("🔬 Error: " + e); }
        }
    });

    function initAI() {
        logMsg("Initializing AI Engine...");
        let attempts = 0;
        let checkReady = setInterval(async () => {
            attempts++;
            if (window.Module && typeof window.Module.run_classifier === 'function') {
                clearInterval(checkReady);
                eiClassifier = new EdgeImpulseClassifier();
                await eiClassifier.init();
                classifierReady = true;
                logMsg("✅ AI Engine Ready!");
                $('ai-confidence').innerText = "AI Confidence: Listening...";
            } else if (attempts > 50) { 
                clearInterval(checkReady);
                logMsg("❌ AI Engine Failed to Load.");
                $('ai-confidence').innerText = "AI Failed - Volume Mode Active";
            }
        }, 100);
    }
    initAI();

    function runAiInference(dataArray) {
        if (!classifierReady || !isAiEnabled) return;
        let results = eiClassifier.classify(dataArray);
        if (!results) return;

        $('label-scores').innerText = results.map(r => r.label + ":" + Math.round(r.value*100) + "%").join("  ");

        let pullScore = null;
        for (let r of results) { if (r.label.toLowerCase() === "pull") { pullScore = r.value; break; } }
        if (pullScore === null) pullScore = results[0].value; 

        let pct = Math.round(pullScore * 100);
        let triggerLevel = threshold / 100;

        $('ai-confidence').innerText = "AI Confidence: " + pct + "%";
        $('ai-confidence').style.color = (pullScore >= triggerLevel) ? "#f00" : "#0f0";

        if (pullScore >= triggerLevel && isVoiceMode) {
            if (micState === 0 && armedMode) processVoiceTrigger(pct, true);
        } else if (micState === 2 && pullScore < (triggerLevel * 0.5)) {
            micState = 0; $('vol-bar').style.background = "#0f0";
        }
    }

    // --- MIC PIPELINE ---
    async function startMic() {
        try {
            audioStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            window.AudioContext = window.AudioContext || window.webkitAudioContext;
            audioContext = new window.AudioContext({ sampleRate: 16000 });
            if (audioContext.state === 'suspended') await audioContext.resume();

            isMicActive = true;
            $('listenBtn').innerText = "Mute Mic 🎤"; $('listenBtn').style.background = "#dc3545";

            const source = audioContext.createMediaStreamSource(audioStream);
            const analyser = audioContext.createAnalyser();
            analyser.fftSize = 256;
            source.connect(analyser);
            const freqData = new Uint8Array(analyser.frequencyBinCount);

            aiProcessor = audioContext.createScriptProcessor(4096, 1, 1);
            source.connect(aiProcessor);
            aiProcessor.connect(audioContext.destination);

            aiProcessor.onaudioprocess = function(e) {
                if (!isMicActive) return;
                const rawChunk = e.inputBuffer.getChannelData(0);
                let chunk16k = rawChunk;
                
                if (audioContext.sampleRate !== 16000) {
                    const ratio = audioContext.sampleRate / 16000;
                    chunk16k = new Float32Array(Math.round(rawChunk.length / ratio));
                    for (let i = 0; i < chunk16k.length; i++) chunk16k[i] = rawChunk[Math.floor(i * ratio)];
                }

                let mean = 0; for (let i = 0; i < chunk16k.length; i++) mean += chunk16k[i]; mean /= chunk16k.length;

                for (let i = 0; i < chunk16k.length; i++) {
                    let rawVal = chunk16k[i] - mean;
                    if (micState !== 1) {
                        let aiVal = rawVal * 32768.0 * 2.0; 
                        if (aiVal > 32767) aiVal = 32767; if (aiVal < -32768) aiVal = -32768;
                        audioDataBuffer.push(aiVal);
                    }
                }

                if (micState !== 1 && audioDataBuffer.length >= 16000) {
                    runAiInference(new Float32Array(audioDataBuffer.slice(0, 16000)));
                    audioDataBuffer = audioDataBuffer.slice(4000); 
                }
            };

            function checkVolume() {
                if (!isMicActive) return;
                analyser.getByteFrequencyData(freqData);
                let sum = 0; for(let i=0; i<freqData.length; i++) sum += freqData[i];
                let avgVol = sum / freqData.length;
                $('vol-bar').style.width = Math.min(100, (avgVol / 1.5)) + "%";

                if (!classifierReady || !isAiEnabled) {
                    if (micState === 0 && avgVol > threshold && isVoiceMode) processVoiceTrigger(avgVol, false);
                    else if (micState === 2 && avgVol < (threshold * 0.8)) { micState = 0; $('vol-bar').style.background = "#0f0"; }
                }
                animId = requestAnimationFrame(checkVolume);
            }
            checkVolume();
            logMsg("✅ Mic Activated.");
        } catch (err) { logMsg("Mic Error: " + err); stopMic(true); }
    }

    function stopMic(resetUI = true) {
        if (aiProcessor) { aiProcessor.disconnect(); aiProcessor = null; }
        if (audioStream) audioStream.getTracks().forEach(t => t.stop());
        if (audioContext && audioContext.state !== 'closed') audioContext.close();
        if (animId) cancelAnimationFrame(animId);
        
        audioDataBuffer = new Array(16000).fill(0); 
        isMicActive = false; micState = 0;
        
        if (resetUI) {
            $('listenBtn').innerText = "Turn On Mic"; $('listenBtn').style.background = "#28A745";
            $('vol-bar').style.background = "#0f0"; $('vol-bar').style.width = "0%";
            logMsg("Mic Muted.");
        }
    }

    $('listenBtn').addEventListener('click', () => {
        if (isMicActive || wasMicActiveBeforeSleep) { wasMicActiveBeforeSleep = false; stopMic(true); }
        else { wasMicActiveBeforeSleep = false; startMic(); }
    });

    document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
            if (isMicActive) { wasMicActiveBeforeSleep = true; stopMic(false); $('listenBtn').innerText = "Mic Paused 💤"; }
        } else {
            if (wasMicActiveBeforeSleep) { wasMicActiveBeforeSleep = false; startMic(); }
        }
    });

    // --- UI, SYNC & MODES ---
    $('syncBtn').addEventListener('click', () => {
        isSyncEnabled = !isSyncEnabled; 
        $('syncBtn').innerText = isSyncEnabled ? "Sync: ON" : "Sync: OFF";
        $('syncBtn').style.background = isSyncEnabled ? "#17a2b8" : "#6c757d";
    });

    $('vmBtn').addEventListener('click', () => {
        isVoiceMode = !isVoiceMode;
        $('vmBtn').innerText = isVoiceMode ? "Mode: VOICE" : "Mode: MANUAL";
        $('vmBtn').style.background = isVoiceMode ? "#9b59b6" : "#fd7e14";
        if (!isVoiceMode) cancelMode(true);
        updateArmUI();
        if (isBleConnected && isSyncEnabled) sendBLECmd(isVoiceMode ? "MODE:VOICE" : "MODE:MANUAL", true);
    });

    $('aiBtn').addEventListener('click', () => {
        isAiEnabled = !isAiEnabled;
        if (isAiEnabled) {
            $('aiBtn').innerText = "AI: ON"; $('aiBtn').style.background = "#27ae60";
            $('ai-confidence').innerText = classifierReady ? "AI Confidence: Listening..." : "AI: engine loading...";
        } else {
            $('aiBtn').innerText = "AI: OFF (Vol)"; $('aiBtn').style.background = "#6c757d";
            $('ai-confidence').innerText = "AI off — volume mode active";
            $('label-scores').innerText = "—";
        }
    });

    window.adjDelay = function(type, amt) {
        if (!isBleConnected) return;
        if (type === 'D') { dVal = Math.max(0, dVal+amt); $('val-D').innerText = dVal.toFixed(1)+"s"; sendBLECmd("D"+dVal.toFixed(1)); }
        else { ddVal = Math.max(0, ddVal+amt); $('val-DD').innerText = ddVal.toFixed(1)+"s"; sendBLECmd("DD"+ddVal.toFixed(1)); }
    };

    function updateArmUI() {
        document.querySelectorAll('.arm-btn').forEach(b => b.classList.remove('active'));
        if (!isVoiceMode) {
            $('arm-status').innerText = "MANUAL MODE (Tap to Fire)"; $('arm-status').style.color = "#fd7e14";
            $('btn-T').innerText = "T (" + lastHouse + ")"; return;
        }
        if (armedMode) $('btn-' + armedMode).classList.add('active');
        if (!armedMode) { $('arm-status').innerText = "SAFE / DISARMED"; $('arm-status').style.color = "#aaa"; }
        else {
            $('arm-status').style.color = "#ff4444";
            if      (armedMode === 'HL') $('arm-status').innerText = hlStep === 0 ? "ARMED: High -> Low" : "ARMED: Now Pulling Low";
            else if (armedMode === 'LH') $('arm-status').innerText = hlStep === 0 ? "ARMED: Low -> High" : "ARMED: Now Pulling High";
            else if (armedMode === 'T')  $('arm-status').innerText = "REPEATING: " + lastHouse;
            else $('arm-status').innerText = "ARMED: " + armedMode;
        }
        $('btn-T').innerText = "T (" + lastHouse + ")";
    }

    window.cancelMode = function(fromSync = false) {
        armedMode = null; hlStep = 0; micState = 0; 
        $('vol-bar').style.background = "#0f0"; $('md-display').style.color = "#aaa";
        updateArmUI();
        if (!fromSync && isBleConnected && isSyncEnabled) sendBLECmd("MODE:CANCEL", true);
    };

    window.setMode = function(mode, fromSync = false) {
        if (!isVoiceMode && !fromSync) {
            let cmd = '';
            if      (mode==='H'||mode==='L') { cmd=mode; hlStep=0; lastHouse=mode; }
            else if (mode==='D')  { cmd='D1H'; hlStep=0; lastHouse='D'; }
            else if (mode==='DR') { cmd='D1L'; hlStep=0; lastHouse='DR'; }
            else if (mode==='HL') { lastHouse='HL'; cmd=(hlStep===0)?'H':'L'; hlStep=(hlStep===0)?1:0; }
            else if (mode==='LH') { lastHouse='LH'; cmd=(hlStep===0)?'L':'H'; hlStep=(hlStep===0)?1:0; }
            else if (mode==='T') {
                if      (lastHouse==='HL') { cmd=(hlStep===0)?'H':'L'; hlStep=(hlStep===0)?1:0; }
                else if (lastHouse==='LH') { cmd=(hlStep===0)?'L':'H'; hlStep=(hlStep===0)?1:0; }
                else if (lastHouse==='D')  cmd='D1H';
                else if (lastHouse==='DR') cmd='D1L';
                else cmd=lastHouse;
            }
            if (cmd) {
                sendBLECmd(cmd);
                if (isSyncEnabled) sendBLECmd("MODE:MAN_UPDATE:"+lastHouse+":"+hlStep, true);
                const b = $('btn-'+mode); if (b) { b.classList.add('active'); setTimeout(()=>b.classList.remove('active'),200); }
                updateArmUI();
            }
            return;
        }
        if (!fromSync) {
            if (armedMode===mode) armedMode=null;
            else { armedMode=mode; if(mode!=='T'&&mode!=='CANCEL') lastHouse=mode; }
        } else {
            armedMode=mode; if(mode!=='T'&&mode!==null&&mode!=='CANCEL') lastHouse=mode;
        }
        hlStep=0; updateArmUI();
        if (!fromSync&&isBleConnected&&isSyncEnabled&&isVoiceMode) sendBLECmd(armedMode?"MODE:"+armedMode+":"+lastHouse:"MODE:CANCEL", true);
    };

    $('connectBtn').addEventListener('click', async () => {
        if (isBleConnected) { if (bleDev?.gatt.connected) bleDev.gatt.disconnect(); return; }
        try {
            logMsg("Searching...");
            bleDev = await navigator.bluetooth.requestDevice({ filters:[{services:[SERVICE_UUID]}] });
            bleDev.addEventListener('gattserverdisconnected', () => {
                isBleConnected=false; $('connectBtn').innerText="Connect BLE"; $('connectBtn').style.background="#007BFF"; 
                $('appTitle').innerText = "AI Puller V29"; logMsg("Disconnected.");
            });
            const server = await bleDev.gatt.connect(); const service = await server.getPrimaryService(SERVICE_UUID);
            rxChar = await service.getCharacteristic(CHAR_RX_UUID); txChar = await service.getCharacteristic(CHAR_TX_UUID);
            await txChar.startNotifications();
            $('appTitle').innerText = "Connected: " + bleDev.name;
            txChar.addEventListener('characteristicvaluechanged', (e) => {
                let msg = new TextDecoder('utf-8').decode(e.target.value).trim();
                if (!msg || msg.startsWith("Err:")) return;

                if (msg.startsWith("MODE:")) {
                    if (!isSyncEnabled) return;
                    if (msg==="MODE:VOICE") { setVoiceMode(true,true); return; }
                    if (msg==="MODE:MANUAL") { setVoiceMode(false,true); return; }
                    let p=msg.split(":"); let st=p[1];
                    if (st==="MAN_UPDATE") { lastHouse=p[2]; if(p[3]) hlStep=parseInt(p[3]); updateArmUI(); return; }
                    if (p[2]) lastHouse=p[2];
                    if (st==="CANCEL") window.cancelMode(true); else window.setMode(st,true);
                    return;
                }
                if (msg.includes("STATUS:")) {
                    let d=msg.match(/Delay: ([\d.]+)/), dd=msg.match(/Dbl: ([\d.]+)/), md=msg.match(/MD: (\d+)/), fd=msg.match(/Field: (\d+)/);
                    if(d) { dVal=parseFloat(d[1]); $('val-D').innerText=dVal.toFixed(1)+"s"; }
                    if(dd) { ddVal=parseFloat(dd[1]); $('val-DD').innerText=ddVal.toFixed(1)+"s"; }
                    if(md) { muteDelay=parseInt(md[1]);$('md-display').innerText="Mute Delay: "+muteDelay+"ms"; }
                    if(fd) { fieldId=parseInt(fd[1]); $('field-display').innerText="Field: "+fieldId; }
                }
                if (msg.includes("Field Set:")) {
                    let m=msg.match(/Field Set: (\d+)/); if(m){ fieldId=parseInt(m[1]); $('field-display').innerText="Field: "+fieldId; }
                }
                logMsg("📡: "+msg);
            });
            isBleConnected = true;
            $('connectBtn').innerText = "Disconnect BLE"; $('connectBtn').style.background = "#dc3545";
            setTimeout(()=>sendBLECmd("?"),500);
        } catch(e) { logMsg("BLE Error: "+e); }
    });

    async function processVoiceTrigger(level, isAi) {
        if (!armedMode || micState !== 0) return;
        micState = 1; $('vol-bar').style.background = "#f00"; $('md-display').style.color = "#ff4444";

        let cmdToSend = '';
        if (armedMode === 'H' || armedMode === 'L') { cmdToSend = armedMode; window.cancelMode(false); }
        else if (armedMode === 'D')  { cmdToSend = 'D1H'; window.cancelMode(false); }
        else if (armedMode === 'DR') { cmdToSend = 'D1L'; window.cancelMode(false); }
        else if (armedMode === 'HL') { if (hlStep === 0) { cmdToSend = 'H'; hlStep = 1; $('arm-status').innerText = "ARMED: Now Pulling Low"; } else { cmdToSend = 'L'; hlStep = 0; window.cancelMode(false); } }
        else if (armedMode === 'LH') { if (hlStep === 0) { cmdToSend = 'L'; hlStep = 1; $('arm-status').innerText = "ARMED: Now Pulling High"; } else { cmdToSend = 'H'; hlStep = 0; window.cancelMode(false); } }
        else if (armedMode === 'T')  {
            if (lastHouse === 'HL') { cmdToSend = (hlStep===0)?'H':'L'; hlStep=(hlStep===0)?1:0; }
            else if (lastHouse === 'LH') { cmdToSend = (hlStep===0)?'L':'H'; hlStep=(hlStep===0)?1:0; }
            else if (lastHouse === 'D')  cmdToSend = 'D1H';
            else if (lastHouse === 'DR') cmdToSend = 'D1L';
            else cmdToSend = lastHouse;
        }

        updateArmUI();
        let tLock = (dVal * 1000) + muteDelay;
        logMsg(`💥 FIRED! (${isAi?'AI ':'Vol '}${Math.round(level)}%) Lockout: ${tLock}ms`);
        if (cmdToSend !== '') await sendBLECmd(cmdToSend);

        setTimeout(() => {
            micState = 2; audioDataBuffer = new Array(16000).fill(0);
            $('vol-bar').style.background = "#f39c12"; $('md-display').style.color = "#aaa";
        }, tLock);
    }

    async function sendBLECmd(cmd, silent=false) {
        if (rxChar && isBleConnected) {
            try { await rxChar.writeValue(new TextEncoder().encode(cmd)); if(!silent) logMsg("🚀 SENT: "+cmd); } catch(e) {}
        }
    }
</script>
</body>
</html>
